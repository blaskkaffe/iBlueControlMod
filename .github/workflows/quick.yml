name: quick
on:
  workflow_dispatch:
    inputs:
      hw_version:
        description: 'Hardware version'
        required: true
        default: 'hw1'
      br_config:
        description: 'BlueRetro config'
        required: true
        default: 'universal'
      hw_tag:
        description: "Set to 'none' to build with an empty BR_HW (what blueretro.io OTA needs for the iBlueControlMod)"
        required: false
        default: ''
      commit_bin:
        description: "Set to 'yes' to commit the built BlueRetro*.bin to firmware/test/ on the branch"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/darthcloud/idf-blueretro:v5.5.0_2024-12-02

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Build with ESP-IDF
      shell: bash
      run: |
        . $IDF_PATH/export.sh
        echo "br_version=$(git describe --always --tags --dirty)" >> $GITHUB_ENV
        VER_HW="${{ github.event.inputs.hw_version }}"
        if [ "${{ github.event.inputs.hw_tag }}" = "none" ]; then VER_HW="iblue"; fi
        echo "$(git describe --always --tags --dirty) $VER_HW ${{ github.event.inputs.br_config }}" | cut -c -31 > version.txt
        cat version.txt
        cp configs/${{ github.event.inputs.hw_version }}/${{ github.event.inputs.br_config }} sdkconfig
        HW_TAG="_${{ github.event.inputs.hw_version }}"
        if [ "${{ github.event.inputs.hw_tag }}" = "none" ]; then HW_TAG=""; fi
        BR_HW="$HW_TAG" BR_SYS=_${{ github.event.inputs.br_config }} idf.py build
    - name: Copy OTA initial binary
      working-directory: ./build
      run: |
        mkdir ota
        mv ota_data_initial.bin ota/
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.br_version }}_${{ github.event.inputs.hw_version }}_${{ github.event.inputs.br_config }}
        path: |
          build/partition_table/partition-table.bin
          build/bootloader/bootloader.bin
          build/ota/ota_data_initial.bin
          build/BlueRetro*.bin
        if-no-files-found: error
    - name: Commit binary to firmware/test
      if: github.event.inputs.commit_bin == 'yes'
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config user.name "github-actions"
        git config user.email "actions@users.noreply.github.com"
        mkdir -p firmware/test
        BIN=$(ls build/BlueRetro*.bin | head -1)
        NAME=BlueRetro_iBlueControlMod_test_${{ env.br_version }}.bin
        cp "$BIN" "firmware/test/$NAME"
        (cd firmware/test && sha256sum BlueRetro_*.bin > SHA256SUMS.txt)
        git add firmware/test
        git commit -m "CI: test firmware $NAME"
        git push origin HEAD:${{ github.ref_name }}
